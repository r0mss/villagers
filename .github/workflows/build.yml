name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: villagers-mod-jar
          path: build/libs/*.jar

      - name: Create/update "latest" release with the raw jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ultimo build (main)"
          body: "Build automatico generado desde el ultimo push a main. Descarga el .jar de abajo directamente (sin necesidad de descomprimir nada)."
          prerelease: true
          files: build/libs/*.jar